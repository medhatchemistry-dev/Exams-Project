name: Deploy master database

on:
  push:
    branches:
      - master
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-master-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-master-database
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Apply master migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: >-
          supabase db push
          --project-ref sbgohdehpkjfsktgdzjj
          --password "$SUPABASE_DB_PASSWORD"
